# ----------------------------------------------------------------------------
# Komuta — PRODUCTION stack (Docker Compose).
#
# Runs the full application behind Nginx + Certbot on the VPS:
#   postgres, redis, api, worker, web, nginx, certbot
#
# Usage:
#   cp .env.example .env   # then fill in real secrets
#   docker compose build
#   docker compose up -d
#   docker compose exec -T api pnpm --filter @komuta/api prisma migrate deploy
#
# All app services read their configuration from .env (env_file). Database
# credentials are also injected into the postgres container via ${VAR}.
# ----------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16
    container_name: komuta-postgres
    restart: unless-stopped
    environment:
      # Derived from DATABASE_URL in .env. Defaults match .env.example.
      POSTGRES_USER: ${POSTGRES_USER:-komuta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-komuta}
      POSTGRES_DB: ${POSTGRES_DB:-komuta}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - komuta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-komuta} -d ${POSTGRES_DB:-komuta}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: komuta-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - komuta
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: komuta-api
    container_name: komuta-api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - komuta
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: komuta-worker
    container_name: komuta-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - komuta

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: komuta-web
    container_name: komuta-web
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - komuta

  nginx:
    image: nginx:alpine
    container_name: komuta-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/komuta.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - api
      - web
    networks:
      - komuta

  certbot:
    image: certbot/certbot
    container_name: komuta-certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Attempt renewal every 12h; certbot only renews certs near expiry.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  komuta:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  certbot-conf:
  certbot-www:
