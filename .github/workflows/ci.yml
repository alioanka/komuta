# ----------------------------------------------------------------------------
# Komuta — Continuous Integration.
#
# Runs typecheck, lint, test and build on every push and pull request.
# Postgres + Redis service containers are provided in case tests need them.
# ----------------------------------------------------------------------------
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    # Backing stores in case the test suite touches the DB / queue.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komuta
          POSTGRES_PASSWORD: komuta
          POSTGRES_DB: komuta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komuta -d komuta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://komuta:komuta@localhost:5432/komuta?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations + seed (for API e2e tests)
        run: |
          pnpm db:deploy
          pnpm db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
