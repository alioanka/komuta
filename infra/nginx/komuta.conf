# ----------------------------------------------------------------------------
# Komuta — Nginx reverse proxy (mounted at /etc/nginx/conf.d/default.conf).
#
# Routes:
#   /api/      -> http://api:4000/        (prefix stripped)
#   /webhooks/ -> http://api:4000/webhooks/   (prefix preserved — Meta needs it)
#   /          -> http://web:3000/        (Next.js app)
#
# Domain: panora.live (the purchased Komuta domain). It must
# match the cert path under /etc/letsencrypt/live/<domain>/ created by certbot
# (see infra/certbot/init-letsencrypt.sh).
# ----------------------------------------------------------------------------

# Upstreams (container DNS names from docker-compose.yml).
upstream komuta_api {
    server api:4000;
}
upstream komuta_web {
    server web:3000;
}

# Map for WebSocket / SSE connection upgrade handling.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP :80 — ACME challenge + redirect to HTTPS -------------------------
server {
    listen 80;
    listen [::]:80;
    server_name panora.live;

    # Let's Encrypt HTTP-01 challenge files are served from here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else is redirected to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 — application --------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panora.live;

    # Cert paths follow /etc/letsencrypt/live/<domain>/. Keep in sync w/ domain.
    ssl_certificate     /etc/letsencrypt/live/panora.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panora.live/privkey.pem;

    # Modern, safe TLS defaults.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — force HTTPS for 2 years (only enable once HTTPS is confirmed good).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Compression.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # Reasonable upload ceiling (WhatsApp media, CSV imports, etc.).
    client_max_body_size 25m;

    # Shared proxy headers.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # --- API ---------------------------------------------------------------
    # Strip the /api prefix: the trailing slash on both location and upstream
    # rewrites /api/foo -> /foo on the api service.
    location /api/ {
        proxy_pass http://komuta_api/;

        # SSE / WebSocket support for the api's live event stream.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE needs buffering off and long-lived connections.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }

    # --- Webhooks ----------------------------------------------------------
    # Prefix preserved: Meta calls /webhooks/... and the api expects it intact.
    location /webhooks/ {
        proxy_pass http://komuta_api/webhooks/;
        proxy_read_timeout 60s;
    }

    # --- Web (Next.js) -----------------------------------------------------
    location / {
        proxy_pass http://komuta_web/;

        # Next.js uses websockets for HMR/live features.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
